
name: DEXON Solana Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  solana-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEXON
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Solana Test
        run: python test_solana.py

      - name: Run DEXON Trading Test
        run: python test_dexon.py

      - name: Run DEXON Risk Test
        run: python test_risk.py

      - name: Run DEXON Auto Trader Test
        run: python test_auto_trader.py
        
